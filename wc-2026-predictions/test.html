<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoring Engine Unit Tests</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0125;
      color: #fff;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #d4af37;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 0.5rem;
    }
    .test-suite {
      margin-top: 1.5rem;
    }
    .test-case {
      background: rgba(14, 43, 92, 0.25);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .test-title {
      font-weight: bold;
      color: #f6e093;
    }
    .test-details {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .badge.pass {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }
    .badge.fail {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
    }
    .summary-card {
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>Scoring Engine Unit Tests</h1>
  
  <div class="summary-card" id="summary">
    Running tests...
  </div>

  <div class="test-suite" id="test-list">
    <!-- Test cases will be injected here -->
  </div>

  <!-- Load app.js (so we can test calculatePoints directly) -->
  <script src="app.js"></script>
  
  <script>
    // Unit Test Cases Definition
    const testCases = [
      // Rule 1: Correct Winner & Correct Score (5 points)
      {
        name: "Rule 1: Home Win - Exact Match",
        pred: [2, 1], act: [2, 1],
        expected: 5
      },
      {
        name: "Rule 1: Draw - Exact Match",
        pred: [0, 0], act: [0, 0],
        expected: 5
      },
      
      // Rule 2: Correct Winner, completely incorrect scoreline (2 points)
      {
        name: "Rule 2: Home Win - All Scores Wrong",
        pred: [2, 0], act: [3, 1],
        expected: 2
      },
      {
        name: "Rule 2: Away Win - All Scores Wrong",
        pred: [0, 2], act: [1, 3],
        expected: 2
      },
      
      // Rule 3: Correct Winner & at least one score correct (3 points)
      {
        name: "Rule 3: Home Win - Home Score Correct",
        pred: [2, 0], act: [2, 1],
        expected: 3
      },
      {
        name: "Rule 3: Away Win - Away Score Correct",
        pred: [1, 3], act: [0, 3],
        expected: 3
      },
      
      // Rule 4: Incorrect Winner, but one correct score (1 point)
      {
        name: "Rule 4: Predicted Home Win, but Draw (Home score correct)",
        pred: [2, 1], act: [2, 2],
        expected: 1
      },
      {
        name: "Rule 4: Predicted Away Win, but Home Win (Away score correct)",
        pred: [0, 2], act: [3, 2],
        expected: 1
      },
      
      // Rule 5: Incorrect Winner & incorrect scoreline (0 points)
      {
        name: "Rule 5: Predicted Home Win, but Away Win (All wrong)",
        pred: [2, 1], act: [0, 3],
        expected: 0
      },
      {
        name: "Rule 5: Predicted Draw, but Home Win (All wrong)",
        pred: [0, 0], act: [2, 1],
        expected: 0
      },
      
      // Rule 6: Draw predicted, Draw occurred, but incorrect score (4 / D points)
      {
        name: "Rule 6: Draw 3-3 Predicted, 0-0 Actual (diff = 6)",
        pred: [3, 3], act: [0, 0],
        expected: 4/6
      },
      {
        name: "Rule 6: Draw 2-2 Predicted, 1-1 Actual (diff = 2)",
        pred: [2, 2], act: [1, 1],
        expected: 2
      }
    ];

    // Run tests
    let passed = 0;
    const listContainer = document.getElementById("test-list");
    
    testCases.forEach((tc, idx) => {
      // Calculate
      const actualPoints = calculatePoints(tc.pred[0], tc.pred[1], tc.act[0], tc.act[1]);
      
      // We use a small epsilon tolerance for float comparison of draw points (4/6)
      const isPass = Math.abs(actualPoints - tc.expected) < 0.0001;
      if (isPass) passed++;
      
      // Render
      const card = document.createElement("div");
      card.className = "test-case";
      card.innerHTML = `
        <div class="test-info">
          <span class="test-title">#${idx + 1}: ${tc.name}</span>
          <span class="test-details">Predicted: ${tc.pred[0]}-${tc.pred[1]} | Actual: ${tc.act[0]}-${tc.act[1]}</span>
          <span class="test-details">Expected: ${tc.expected.toFixed(2)} | Actual: ${actualPoints.toFixed(2)}</span>
        </div>
        <span class="badge ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASSED' : 'FAILED'}</span>
      `;
      listContainer.appendChild(card);
    });

    // Render Summary
    const summary = document.getElementById("summary");
    if (passed === testCases.length) {
      summary.innerHTML = `<strong>SUCCESS:</strong> All ${passed} / ${testCases.length} scoring engine unit tests PASSED successfully!`;
      summary.style.borderColor = "#10b981";
      summary.style.background = "rgba(16, 185, 129, 0.05)";
    } else {
      summary.innerHTML = `<strong>FAILURE:</strong> Only ${passed} / ${testCases.length} unit tests passed. Check the log below.`;
      summary.style.borderColor = "#ef4444";
      summary.style.background = "rgba(239, 68, 68, 0.05)";
    }
  </script>
</body>
</html>
