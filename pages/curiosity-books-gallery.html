<h2 class="button_03" style="text-align:center;">Random pictures of my books</h2>

<!-- Trigger to initialize the gallery after HTML is injected -->
<img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" onload="if(typeof initGallery === 'function') initGallery();" style="display: none;" alt="init trigger">

<!-- Thumbnails Grid -->
<div id="gallery-thumbnails" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin: 2em 0;">
    <!-- Thumbnails will be injected here by JS -->
</div>

<!-- Lightbox Overlay -->
<div id="gallery-lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; flex-direction: column;">
    
    <!-- Close Button -->
    <button onclick="closeLightbox()" style="position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: white; font-size: 2em; cursor: pointer; z-index: 10001; padding: 10px; box-shadow: none;">&times;</button>
    
    <!-- Navigation Buttons -->
    <button onclick="prevLightboxImage(event)" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: white; font-size: 2em; cursor: pointer; z-index: 10001; padding: 10px 20px; border-radius: 50%;">&lsaquo;</button>
    
    <!-- Image -->
    <img id="lightbox-img" src="" style="max-width: 90%; max-height: 90vh; object-fit: contain; box-shadow: 0 4px 20px rgba(0,0,0,0.5);" alt="Gallery Image">
    
    <button onclick="nextLightboxImage(event)" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: white; font-size: 2em; cursor: pointer; z-index: 10001; padding: 10px 20px; border-radius: 50%;">&rsaquo;</button>
    
</div>
